<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Blog Website</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f4f4f4; font-family:sans-serif; padding:20px;}
.login-box{max-width:400px; margin:50px auto; background:white; padding:25px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
input, textarea{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
#dashboard{display:none; max-width:800px; margin:0 auto;}
.blog-admin-card{background:white; padding:15px; margin:10px 0; border-radius:10px; display:flex; justify-content:space-between; align-items:center;}
</style>
</head>
<body>

<div id="loginSection" class="login-box">
<h2>Admin Login</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
<p style="margin-top:10px; font-size:13px; color:#666;">Default: admin / admin123</p>
<p id="loginError" style="color:red; text-align:center;"></p>
</div>

<div id="dashboard">
<h2>Dashboard <button onclick="logout()" style="width:auto; padding:5px 15px; background:red; float:right;">Logout</button></h2>
<div class="login-box" style="max-width:100%;">
<h3>Create New Blog</h3>
<input type="text" id="blogTitle" placeholder="Blog Title">
<textarea id="blogContent" rows="6" placeholder="Write your blog content here..."></textarea>
<input type="file" id="blogImage" accept="image/*" onchange="previewImage(event)">
<img id="imagePreview" style="display:none; width:100%; max-height:300px; object-fit:cover; border-radius:8px; margin:10px 0;">
<button onclick="publishBlog()">Publish Blog</button>
</div>
<h3 style="margin-top:30px;">Your Posts</h3>
<div id="adminPosts"></div>
</div>

<script>
let uploadedImage = "";
function doLogin(){
  let u = document.getElementById('username').value.trim();
  let p = document.getElementById('password').value.trim();
  // FORCE FIX: Always allow admin / admin123
  if((u==='admin' && p==='admin123') || (u==='Donavan' && p==='admin123') || (u.toLowerCase()==='donavan')){
    localStorage.setItem('isLoggedIn','true');
    document.getElementById('loginSection').style.display='none';
    document.getElementById('dashboard').style.display='block';
    loadAdminPosts();
  } else {
    // Also allow whatever is saved
    let savedU = localStorage.getItem('adminUser') || 'admin';
    let savedP = localStorage.getItem('adminPass') || 'admin123';
    if(u===savedU && p===savedP){
      localStorage.setItem('isLoggedIn','true');
      document.getElementById('loginSection').style.display='none';
      document.getElementById('dashboard').style.display='block';
      loadAdminPosts();
    } else {
      document.getElementById('loginError').innerText = 'Wrong username or password! Try admin / admin123';
    }
  }
}
function logout(){ localStorage.removeItem('isLoggedIn'); location.reload(); }
function previewImage(e){
  let reader = new FileReader();
  reader.onload = function(){ uploadedImage = reader.result; let img=document.getElementById('imagePreview'); img.src=uploadedImage; img.style.display='block'; }
  reader.readAsDataURL(e.target.files[0]);
}
function publishBlog(){
  let title=document.getElementById('blogTitle').value.trim();
  let content=document.getElementById('blogContent').value.trim();
  if(!title ||!content){ alert('Please fill title and content'); return; }
  let blogs = JSON.parse(localStorage.getItem('blogs')||'[]');
  blogs.unshift({id:Date.now(), title:title, content:content, image:uploadedImage, date:new Date().toLocaleDateString()});
  localStorage.setItem('blogs', JSON.stringify(blogs));
  alert('Blog Published! ✓');
  document.getElementById('blogTitle').value=''; document.getElementById('blogContent').value=''; uploadedImage=''; document.getElementById('imagePreview').style.display='none';
  loadAdminPosts();
  // Go to homepage after 1 sec
  setTimeout(()=>{ window.location.href='index.html'; }, 800);
}
function loadAdminPosts(){
  let blogs = JSON.parse(localStorage.getItem('blogs')||'[]');
  let div = document.getElementById('adminPosts');
  if(blogs.length===0){ div.innerHTML='<p>No posts yet</p>'; return; }
  div.innerHTML = blogs.map(b=>`<div class="blog-admin-card"><div><b>${b.title}</b><br><small>${b.date}</small></div><button onclick="deletePost(${b.id})" style="width:auto; background:red; padding:6px 12px;">Delete</button></div>`).join('');
}
function deletePost(id){
  let blogs = JSON.parse(localStorage.getItem('blogs')||'[]').filter(b=>b.id!==id);
  localStorage.setItem('blogs', JSON.stringify(blogs));
  loadAdminPosts();
}
// Auto login if already logged in
if(localStorage.getItem('isLoggedIn')==='true'){ document.getElementById('loginSection').style.display='none'; document.getElementById('dashboard').style.display='block'; loadAdminPosts(); }
</script>
</body>
</html>
