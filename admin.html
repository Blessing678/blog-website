<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin - Donavan's Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
<div class="admin-container">

    <!-- LOGIN FORM -->
    <div id="loginForm" class="admin-card">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="login()">Login</button>
        <p id="loginMessage" class="message"></p>
    </div>

    <!-- DASHBOARD - Hidden until login -->
    <div id="dashboard" class="dashboard hidden">

        <!-- SETTINGS -->
        <div class="admin-card settings-card">
            <h2>Settings</h2>
            <input type="text" id="newUsername" placeholder="New Username">
            <input type="password" id="newPassword" placeholder="New Password">
            <button onclick="saveCredentials()">Save Credentials</button>
            <p id="settingsMessage" class="message"></p>
        </div>
<!-- CREATE BLOG -->
        <div class="admin-card">
            <h2>Create New Blog</h2>
            <form id="blogForm">
                <input type="text" id="blogTitle" placeholder="Blog Title" required>
                <textarea id="blogContent" placeholder="Blog Content" rows="6" required></textarea>

                <label>Upload Image:</label>
                <input type="file" id="postImage" accept="image/*">
                <img id="imagePreview" style="max-width:200px; display:none; margin-top:10px; border-radius:8px;">

                <button type="submit">Publish Blog</button>
            </form>
            <p id="formMessage" class="message"></p>
        </div>

        <!-- BLOG LIST -->
        <div class="admin-card">
            <h2>Your Blog Posts</h2>
            <div id="adminPosts"></div>
        </div>

        <button onclick="logout()" style="background:red;">Logout</button>
    </div> </div> <script src="app.js"></script>
</body>
</html>
